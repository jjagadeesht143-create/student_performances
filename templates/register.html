{% extends "base.html" %}
{% block title %}Create Account - Student Performance System{% endblock %}
{% block content %}
<main class="auth-centered"><section class="login-card card"><div class="card-body"><div class="login-card-heading"><span class="eyebrow">GET STARTED</span><h2>Create Your Account</h2><p>Build a clearer view of student performance.</p></div><form method="post"><div class="mb-3"><label class="form-label" for="name">Full Name</label><input class="form-control" id="name" name="name" value="{{ request.form.get('name', '') }}" autocomplete="name" required></div><div class="mb-3"><label class="form-label" for="email">Email</label><input class="form-control" type="email" id="email" name="email" value="{{ request.form.get('email', '') }}" autocomplete="email" required></div><div class="mb-3"><label class="form-label" for="password">Password</label><input class="form-control" type="password" id="password" name="password" minlength="8" autocomplete="new-password" required></div><div class="mb-4"><label class="form-label" for="confirm_password">Confirm Password</label><input class="form-control" type="password" id="confirm_password" name="confirm_password" minlength="8" autocomplete="new-password" required></div><button class="btn btn-primary w-100" type="submit">Create Account</button></form><div class="auth-divider"><span>OR</span></div><a class="btn btn-google w-100" href="{{ url_for('google_login') }}" data-google-login><i class="fa-brands fa-google" aria-hidden="true"></i><span>Continue with Google</span></a><p class="auth-switch">Already have an account? <a href="{{ url_for('login') }}">Sign In</a></p></div></section></main>
{% endblock %}
