{% extends "base.html" %}
{% block title %}Add Student{% endblock %}
{% block content %}
<h2 class="mb-4">Add Student</h2>
<div class="card">
<div class="card-body">
<form method="post">
  <div class="row g-3">
    <div class="col-md-6">
      <label class="form-label">Name</label>
      <input type="text" name="name" class="form-control" value="{{ form.get('name','') }}" required>
    </div>
    <div class="col-md-3">
      <label class="form-label">Age</label>
      <input type="number" name="age" class="form-control" value="{{ form.get('age','') }}" required>
    </div>
    <div class="col-md-3">
      <label class="form-label">Gender</label>
      <select name="gender" class="form-select" required>
        <option value="">Select...</option>
        <option {{ 'selected' if form.get('gender')=='Male' }}>Male</option>
        <option {{ 'selected' if form.get('gender')=='Female' }}>Female</option>
        <option {{ 'selected' if form.get('gender')=='Other' }}>Other</option>
      </select>
    </div>

    <div class="col-md-3">
      <label class="form-label">Study Time (hrs/day)</label>
      <input type="number" step="0.1" name="study_time" class="form-control" value="{{ form.get('study_time','') }}" required>
    </div>
    <div class="col-md-3">
      <label class="form-label">Attendance (%)</label>
      <input type="number" step="0.1" name="attendance" class="form-control" value="{{ form.get('attendance','') }}" required>
    </div>
    <div class="col-md-3">
      <label class="form-label">Previous Score</label>
      <input type="number" step="0.1" name="previous_score" class="form-control" value="{{ form.get('previous_score','') }}" required>
    </div>
    <div class="col-md-3">
      <label class="form-label">Assignment Score</label>
      <input type="number" step="0.1" name="assignment_score" class="form-control" value="{{ form.get('assignment_score','') }}" required>
    </div>

    <div class="col-md-6">
      <label class="form-label">Parental Education</label>
      <select name="parental_education" class="form-select" required>
        <option value="">Select...</option>
        <option {{ 'selected' if form.get('parental_education')=='High School' }}>High School</option>
        <option {{ 'selected' if form.get('parental_education')=='Bachelors' }}>Bachelors</option>
        <option {{ 'selected' if form.get('parental_education')=='Graduate' }}>Graduate</option>
      </select>
    </div>
    <div class="col-md-6">
      <label class="form-label">Extracurricular Activity</label>
      <select name="extracurricular_activity" class="form-select" required>
        <option value="">Select...</option>
        <option {{ 'selected' if form.get('extracurricular_activity')=='Yes' }}>Yes</option>
        <option {{ 'selected' if form.get('extracurricular_activity')=='No' }}>No</option>
      </select>
    </div>
  </div>

  <div class="mt-4">
    <button type="submit" class="btn btn-primary"><i class="fa-solid fa-save me-1"></i>Save Student</button>
    <a href="{{ url_for('students') }}" class="btn btn-outline-secondary">Cancel</a>
  </div>
</form>
</div>
</div>
{% endblock %}
