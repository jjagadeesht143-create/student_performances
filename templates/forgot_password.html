{% extends "base.html" %}
{% block title %}Reset Password - Student Performance System{% endblock %}
{% block content %}
<main class="auth-centered"><section class="login-card card"><div class="card-body"><div class="login-card-heading"><span class="eyebrow">ACCOUNT RECOVERY</span><h2>Forgot Password?</h2><p>Password reset email is not enabled until an email service is configured.</p></div><form method="post"><div class="mb-4"><label class="form-label" for="email">Email</label><input class="form-control" type="email" id="email" name="email" autocomplete="email" required></div><button class="btn btn-primary w-100" type="submit">Request Reset</button></form><p class="auth-switch"><a href="{{ url_for('login') }}">Back to Sign In</a></p></div></section></main>
{% endblock %}
