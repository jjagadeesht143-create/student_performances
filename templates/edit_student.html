{% extends "base.html" %}
{% block title %}Edit Student{% endblock %}
{% block content %}
<h2 class="mb-4">Edit Student #{{ student.id }}</h2>
<div class="card">
<div class="card-body">
<form method="post">
  <div class="row g-3">
    <div class="col-md-6">
      <label class="form-label">Name</label>
      <input type="text" name="name" class="form-control" value="{{ student.name }}" required>
    </div>
    <div class="col-md-3">
      <label class="form-label">Age</label>
      <input type="number" name="age" class="form-control" value="{{ student.age }}" required>
    </div>
    <div class="col-md-3">
      <label class="form-label">Gender</label>
      <select name="gender" class="form-select" required>
        <option {{ 'selected' if student.gender=='Male' }}>Male</option>
        <option {{ 'selected' if student.gender=='Female' }}>Female</option>
        <option {{ 'selected' if student.gender=='Other' }}>Other</option>
      </select>
    </div>

    <div class="col-md-3">
      <label class="form-label">Study Time (hrs/day)</label>
      <input type="number" step="0.1" name="study_time" class="form-control" value="{{ student.study_time }}" required>
    </div>
    <div class="col-md-3">
      <label class="form-label">Attendance (%)</label>
      <input type="number" step="0.1" name="attendance" class="form-control" value="{{ student.attendance }}" required>
    </div>
    <div class="col-md-3">
      <label class="form-label">Previous Score</label>
      <input type="number" step="0.1" name="previous_score" class="form-control" value="{{ student.previous_score }}" required>
    </div>
    <div class="col-md-3">
      <label class="form-label">Assignment Score</label>
      <input type="number" step="0.1" name="assignment_score" class="form-control" value="{{ student.assignment_score }}" required>
    </div>

    <div class="col-md-6">
      <label class="form-label">Parental Education</label>
      <select name="parental_education" class="form-select" required>
        <option {{ 'selected' if student.parental_education=='High School' }}>High School</option>
        <option {{ 'selected' if student.parental_education=='Bachelors' }}>Bachelors</option>
        <option {{ 'selected' if student.parental_education=='Graduate' }}>Graduate</option>
      </select>
    </div>
    <div class="col-md-6">
      <label class="form-label">Extracurricular Activity</label>
      <select name="extracurricular_activity" class="form-select" required>
        <option {{ 'selected' if student.extracurricular_activity=='Yes' }}>Yes</option>
        <option {{ 'selected' if student.extracurricular_activity=='No' }}>No</option>
      </select>
    </div>
  </div>

  <div class="mt-4">
    <button type="submit" class="btn btn-primary"><i class="fa-solid fa-save me-1"></i>Update Student</button>
    <a href="{{ url_for('students') }}" class="btn btn-outline-secondary">Cancel</a>
  </div>
</form>
</div>
</div>
{% endblock %}
